<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        <button id="generate-btn">Generate Palette</button>
        <div class="palette-container">
            <div class="color-box">
                <div class="color" style="background-color: #b3ecf5;"></div>
                <div class="color-info"><span class="hex-value">#B3ECF5</span><span class="copy-btn" title="Copy to clipboard">&#128203</span></div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #81d4fa;"></div>
                <div class="color-info"><span class="hex-value">#81D4FA</span><span class="copy-btn" title="Copy to clipboard">&#128203</span></div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #4fc3f2;"></div>
                <div class="color-info"><span class="hex-value">#4FC3F2</span><span class="copy-btn" title="Copy to clipboard">&#128203</span></div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #2986f6;"></div>
                <div class="color-info"><span class="hex-value">#2986F6</span><span class="copy-btn" title="Copy to clipboard">&#128203</span></div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #e1f5f3;"></div>
                <div class="color-info"><span class="hex-value">#E1F5FE</span><span class="copy-btn" title="Copy to clipboard">&#128203</span></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
